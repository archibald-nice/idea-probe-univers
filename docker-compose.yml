services:
  idea-engine:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: idea-engine
    env_file:
      - .env
    environment:
      RUN_AT_HOUR: "${RUN_AT_HOUR:-21}"
      RUN_AT_UTC_OFFSET: "${RUN_AT_UTC_OFFSET:-8}"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
